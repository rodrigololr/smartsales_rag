# MVP local: docker compose up --build  (requer LLM_API_KEY no arquivo .env da raiz)
# Vitrine: http://localhost:3000  | Gateway: http://localhost:8000/api/v1/health
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartsales
      POSTGRES_PASSWORD: smartsales
      POSTGRES_DB: smartsales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsales"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sessões, cache semântico e catalog:version (specs/architecture/02, seção 4).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Indexa data/catalog.json + data/manuals/ (UC08). Fontes inalteradas são puladas.
  ingest:
    build: ./backend
    command: ["python", "-m", "app.ingestion.run", "--catalog", "/data/catalog.json", "--manuals", "/data/manuals", "--relations", "/data/product_relations.json"]
    environment: &backend-env
      DATABASE_URL: postgresql://smartsales:smartsales@db:5432/smartsales
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:?defina LLM_API_KEY no .env da raiz}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.72}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      ingest:
        condition: service_completed_successfully

  middleend:
    build: ./middleend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8001
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      # Leitura de products para revalidar estoque e preço no cache hit (RN01).
      DATABASE_URL: postgresql://smartsales:smartsales@db:5432/smartsales
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      # Lido pelo navegador, por isso aponta para a porta publicada no host.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - middleend

volumes:
  pgdata:
  frontend_node_modules:
