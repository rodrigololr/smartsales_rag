name: Python domain modules
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, middleend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartsales
          POSTGRES_PASSWORD: smartsales
          POSTGRES_DB: smartsales
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartsales" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smartsales:smartsales@localhost:5432/smartsales
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            tests/requirements-specs.txt
            backend/requirements.txt
            middleend/requirements.txt
      - run: uv venv && uv pip install -r requirements-dev.txt
      # Unit + integration (pgvector service above) count toward the 70% gate.
      - run: uv run --no-project python -m pytest tests -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=70
        working-directory: ${{ matrix.service }}
      - run: uv run --no-project python -m ruff check app tests
        working-directory: ${{ matrix.service }}
      - run: uv run --no-project python -m mypy app
        working-directory: ${{ matrix.service }}
