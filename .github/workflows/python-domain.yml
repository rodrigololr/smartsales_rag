name: Python domain modules
on:
  pull_request:
  push:
    branches: [main, develop, codex/B04-M02-M03-domain-foundations]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, middleend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/requirements-specs.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=70
        working-directory: ${{ matrix.service }}
      - run: python -m ruff check app tests/unit
        working-directory: ${{ matrix.service }}
      - run: python -m mypy app
        working-directory: ${{ matrix.service }}
