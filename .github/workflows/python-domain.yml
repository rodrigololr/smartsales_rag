name: Python domain modules
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, middleend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartsales
          POSTGRES_PASSWORD: smartsales
          POSTGRES_DB: smartsales
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartsales" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smartsales:smartsales@localhost:5432/smartsales
      EVALUATOR_COVERAGE: ${{ matrix.service == 'backend' && '--cov=tests.ragas_eval' || '' }}
      RAGAS_DO_NOT_TRACK: "true"
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            tests/requirements-specs.txt
            backend/requirements.txt
            backend/requirements-eval.lock
            middleend/requirements.txt
      - run: uv venv && uv pip install -r requirements-dev.txt
      - name: Install pinned B05 evaluator dependencies (backend only)
        if: matrix.service == 'backend'
        run: uv pip install -r backend/requirements-eval.lock
      # Unit + integration (pgvector service above) count toward the 70% gate.
      - run: uv run --no-project python -m pytest tests -v --cov=app ${EVALUATOR_COVERAGE} --cov-config=../pyproject.toml --cov-branch --cov-report=term-missing --cov-fail-under=70
        working-directory: ${{ matrix.service }}
      - run: uv run --no-project python -m ruff check app tests
        working-directory: ${{ matrix.service }}
      - run: uv run --no-project python -m mypy app
        working-directory: ${{ matrix.service }}
      - name: Require coverage of evaluator code (excluding test files)
        if: matrix.service == 'backend'
        run: uv run --no-project python -m coverage report --rcfile=../pyproject.toml --include='*/tests/ragas_eval/*.py' --fail-under=70
        working-directory: backend
      - name: B05 strict evaluator types (mechanism only, no homologation)
        if: matrix.service == 'backend'
        run: uv run --no-project python -m mypy tests/ragas_eval
        working-directory: backend
      - name: Validate B05 sources without certifying RAG quality
        if: matrix.service == 'backend'
        run: uv run --no-project python -m tests.ragas_eval.eval_runner --mode validate
        working-directory: backend
