[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

# RAGAS 0.3.0 has no py.typed marker; the evaluator exposes typed scorer protocols.
[[tool.mypy.overrides]]
module = ["ragas", "ragas.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["*/tests/ragas_eval/test_*.py", "*/tests/ragas_eval/conftest.py"]
